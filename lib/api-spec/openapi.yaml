openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Website enquiries and checklist requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit a quote enquiry or request the free cleaning checklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCreated"
        "400":
          description: Invalid lead details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lead could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LeadInput:
      type: object
      required:
        - leadType
        - fullName
        - email
      properties:
        leadType:
          type: string
          enum: [quote, checklist]
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          maxLength: 40
        serviceAddress:
          type: string
          maxLength: 500
        serviceType:
          type: string
          enum: [standard, deep_clean, move_in_out, commercial_office, other]
        propertySize:
          type: string
          enum: [1_bed_1_bath, 2_bed_1_2_bath, 3_bed_3_plus_bath, 4_plus_bedrooms]
        specialRequests:
          type: string
          maxLength: 2000
        preferredDate:
          type: string
          format: date
        preferredTimeWindows:
          type: array
          items:
            type: string
            enum: [morning, afternoon, flexible]
        cleaningFrequency:
          type: string
          enum: [one_time, weekly, bi_weekly, monthly]
    LeadCreated:
      type: object
      required:
        - id
        - leadType
        - submittedAt
        - notificationSent
        - checklistUrl
      properties:
        id:
          type: string
        leadType:
          type: string
          enum: [quote, checklist]
        submittedAt:
          type: string
          format: date-time
        notificationSent:
          type: boolean
        checklistUrl:
          type: ["string", "null"]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

